#!/usr/sbin/nft -f
flush ruleset

define WAN = "enp1s0"
define DMZ = "enp3s0"
define LAN = "enp4s0"

table ip nat {
  chain postrouting {
    type nat hook postrouting priority 100;
    oifname $WAN masquerade
  }
}

table inet filter {
  chain input {
    type filter hook input priority 0; policy accept;
  }
  chain forward {
    type filter hook forward priority 0; policy drop;
    ct state established,related accept
    ip saddr 192.168.10.10 ip daddr 192.168.20.10 tcp dport 3306 accept
    iifname $LAN accept
    iifname $DMZ oifname $WAN accept
  }
}
