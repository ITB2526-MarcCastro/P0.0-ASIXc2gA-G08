interface=enp3s0
interface=enp4s0
bind-interfaces
except-interface=lo
domain=n08.local
local=/n08.local/
expand-hosts

# DHCP només a la Intranet
dhcp-range=set:intranet,192.168.20.100,192.168.20.200,255.255.255.0,12h
dhcp-option=tag:intranet,option:router,192.168.20.1
dhcp-option=tag:intranet,option:dns-server,192.168.20.1

# Noms propis
host-record=R-N08,R-N08.n08.local,192.168.20.1
host-record=R,R.n08.local,192.168.20.1
host-record=W-N08,W-N08.n08.local,192.168.10.10
host-record=F-N08,F-N08.n08.local,192.168.10.11
host-record=B-N08,B-N08.n08.local,192.168.20.10

no-resolv
server=8.8.8.8
server=1.1.1.1
no-hosts
